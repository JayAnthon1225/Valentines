<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 350px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 100px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      left: 30px;
    }

    #noBtn {
      background-color: #ccc;
      color: #333;
      left: 180px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Liza 💕</h1>
    <p>Will you be my Valentine? 🌹</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200;
      const y = Math.random() * 60;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          background: linear-gradient(135deg, #ff9a9e, #fad0c4);
          font-family:'Comic Sans MS', cursive;
          text-align:center;
        ">
          <h1 style="color:#ff4d6d;">YAYYY 💘</h1>
          <p style="font-size:22px;">
            Thank you for saying YES 🥹❤️<br>
            I can’t wait to spend Valentine’s with you 🌹
          </p>
        </div>
      `;
    }
  </script>

</body>
</html>
