<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 60px 70px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      width: 80vw;
      max-width: 600px;
      min-height: 420px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 46px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    p {
      font-size: 24px;
      font-weight: 400;
      color: #333;
      margin-bottom: 50px;
      line-height: 1.4;
    }

    .buttons {
      position: relative;
      height: 160px;
    }

    button {
      padding: 16px 42px;
      font-size: 20px;
      font-weight: 500;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      left: 100px;
      transition: transform 0.3s ease;
      transform-origin: center;
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #444;
      left: 320px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hello LIZA MARIE 💕</h1>
    <p>Would you like to be my Valentine? 🌹</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    let scale = 1;

    function growYes() {
      scale += 0.2;
      yesBtn.style.transform = `scale(${scale})`;
    }

    noBtn.addEventListener("mouseenter", () => {
      growYes();

      const x = Math.random() * 350;
      const y = Math.random() * 90;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          background: linear-gradient(135deg, #ff9a9e, #fad0c4);
          font-family:'Segoe UI', Roboto, Arial, sans-serif;
          text-align:center;
          padding:40px;
        ">
          <h1 style="color:#ff4d6d; font-size:56px; font-weight:600;">
            Thank you 💖
          </h1>
          <p style="font-size:26px; color:#333; line-height:1.5;">
            I’m really happy you said yes.<br>
            I’m looking forward to spending Valentine’s Day with you 🌹
          </p>
        </div>
      `;
    }
  </script>

</body>
</html>
