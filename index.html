<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 60px 70px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      width: 80vw;
      max-width: 600px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: #ff4d6d;
      font-size: 46px;
      font-weight: 600;
      margin: 0 0 16px 0;
    }

    p {
      font-size: 24px;
      font-weight: 400;
      color: #333;
      margin: 0 0 50px 0;
      line-height: 1.4;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 16px 42px;
      font-size: 20px;
      font-weight: 500;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.3s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      left: 30%;
      transform-origin: center;
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #444;
      left: 60%;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hello Liza Marie 💕</h1>
    <p>Would you like to be my Valentine? 🌹</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const buttonsDiv = document.querySelector(".buttons");

    let scale = 1;

    function growYes() {
      scale += 0.2;
      yesBtn.style.transform = `scale(${scale})`;
    }

    function moveNo() {
      const containerWidth = buttonsDiv.offsetWidth - noBtn.offsetWidth;
      const containerHeight = buttonsDiv.offsetHeight - noBtn.offsetHeight;

      let x, y;
      let yesRect = yesBtn.getBoundingClientRect();
      let buttonsRect = buttonsDiv.getBoundingClientRect();

      do {
        x = Math.random() * containerWidth;
        y = Math.random() * containerHeight;

        // Calculate No button rect relative to buttonsDiv
        let noLeft = buttonsRect.left + x;
        let noRight = noLeft + noBtn.offsetWidth;
        let noTop = buttonsRect.top + y;
        let noBottom = noTop + noBtn.offsetHeight;

      // Repeat if overlapping Yes
      } while (
        !(noRight < yesRect.left || noLeft > yesRect.right || noBottom < yesRect.top || noTop > yesRect.bottom)
      );

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", () => {
      growYes();
      moveNo();
    });

    noBtn.addEventListener("click", () => {
      growYes();
      moveNo();
    });

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          background: linear-gradient(135deg, #ff9a9e, #fad0c4);
          font-family:'Segoe UI', Roboto, Arial, sans-serif;
          text-align:center;
          padding:40px;
        ">
          <h1 style="color:#ff4d6d; font-size:56px; font-weight:600; margin:0 0 16px 0;">
            Thank you 💖
          </h1>
          <p style="font-size:26px; color:#333; line-height:1.5; margin:0;">
            I’m really happy you said yes.<br>
            I’m looking forward to spending Valentine’s Day with you 🌹
          </p>
        </div>
      `;
    }
  </script>

</body>
</html>
